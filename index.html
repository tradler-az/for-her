<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Girlfriends Day ❤️</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root{
      --rose:#e11d48;
      --rose-dark:#be123c;
      --pink:#f9a8d4;
      --cream:#fff8f5;
    }


*{box-sizing:border-box}
html,body{height:100%}

body{
  margin:0;
  overflow:hidden;
  font-family: ui-serif, Georgia, Cambria, "Times New Roman", Times, serif;
  background:
    radial-gradient(circle at 20% 20%, rgba(255,182,193,.35), transparent 28%),
    radial-gradient(circle at 80% 10%, rgba(244,114,182,.28), transparent 24%),
    radial-gradient(circle at 50% 85%, rgba(251,207,232,.35), transparent 30%),
    linear-gradient(180deg, #fffdfc 0%, var(--cream) 45%, #fff1f2 100%);
}

.heart{
  position:absolute;
  width:16px;height:16px;
  background:rgba(244,114,182,.18);
  transform:rotate(45deg);
  animation:float linear infinite;
  filter:blur(.2px);
}
.heart:before,.heart:after{
  content:"";position:absolute;width:16px;height:16px;
  background:inherit;border-radius:999px;
}
.heart:before{left:-8px}
.heart:after{top:-8px}
@keyframes float{
  from{transform:translateY(110vh) rotate(45deg);opacity:0}
  10%{opacity:1}
  to{transform:translateY(-20vh) rotate(45deg);opacity:0}
}

.glass{
  background:rgba(255,255,255,.68);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border:1px solid rgba(255,255,255,.6);
  box-shadow:0 18px 50px rgba(225,29,72,.12);
}

.title{
  background:linear-gradient(135deg,#be123c,#f472b6,#be123c);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  text-shadow:0 8px 30px rgba(244,114,182,.15);
}

.title-heart{
  display:inline-block;
  animation:heartBeat 1.2s ease-in-out infinite;
  transform-origin:center;
  filter: drop-shadow(0 6px 14px rgba(225,29,72,.25));
}
@keyframes heartBeat{
  0%,100%{transform:scale(1)}
  14%{transform:scale(1.18)}
  28%{transform:scale(1)}
  42%{transform:scale(1.18)}
  70%{transform:scale(1)}
}

.yes-btn{
  animation:pulseGlow 1.8s ease-in-out infinite;
  box-shadow:0 18px 40px rgba(225,29,72,.28);
}
@keyframes pulseGlow{
  0%,100%{transform:scale(1);box-shadow:0 18px 40px rgba(225,29,72,.25)}
  50%{transform:scale(1.06);box-shadow:0 22px 55px rgba(225,29,72,.4)}
}

#noBtn{
  position:fixed;
  z-index:50;
  transition:transform .14s ease, left .14s ease, top .14s ease;
  touch-action:none;
  box-shadow:0 12px 30px rgba(15,23,42,.18);
}

.bear{
  width:180px;height:180px;position:relative;margin:0 auto;
  animation:bob 3.6s ease-in-out infinite;
}
@keyframes bob{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-6px)}
}
.ear{
  position:absolute;width:58px;height:58px;border-radius:999px;
  background:#8b5e3c;top:8px;
}
.ear.left{left:18px}
.ear.right{right:18px}
.ear::after{
  content:"";position:absolute;inset:12px;border-radius:999px;background:#f4c7b5;
}
.head{
  position:absolute;inset:18px;border-radius:999px;background:#9b6a45;
  box-shadow: inset 0 -8px 0 rgba(0,0,0,.06);
}
.eye{
  position:absolute;width:36px;height:36px;border-radius:999px;background:#fff;top:60px;
  overflow:hidden;
}
.eye.left{left:42px}
.eye.right{right:42px}
.pupil{
  position:absolute;width:14px;height:14px;border-radius:999px;background:#111827;
  left:11px;top:11px;transition:transform .05s linear;
}
.muzzle{
  position:absolute;width:88px;height:62px;background:#f1d2bf;border-radius:999px;
  left:50%;transform:translateX(-50%);top:92px;
}
.nose{
  position:absolute;width:18px;height:12px;background:#111827;border-radius:999px;
  left:50%;transform:translateX(-50%);top:14px;
}
.mouth{
  position:absolute;width:34px;height:20px;border-bottom:3px solid #7f1d1d;border-radius:0 0 24px 24px;
  left:50%;transform:translateX(-50%);top:28px;
}
.blush{
  position:absolute;width:16px;height:10px;border-radius:999px;background:#fb7185;opacity:.55;top:22px;
}
.blush.left{left:12px}
.blush.right{right:12px}

.celebrate{
  position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:rgba(255,248,245,.72);backdrop-filter:blur(6px);
  opacity:0;pointer-events:none;transition:opacity .35s ease;z-index:60;
}
.celebrate.show{opacity:1;pointer-events:auto}
.card{
  background:white;border-radius:28px;padding:32px 28px;max-width:560px;width:min(92vw,560px);
  text-align:center;box-shadow:0 30px 70px rgba(225,29,72,.18);
  border:1px solid rgba(244,114,182,.18);
}

#confetti{
  position:fixed;inset:0;pointer-events:none;z-index:55;
}
</style>
</head>
<body>

  <canvas id="confetti"></canvas>

      <div class="bear mb-6" id="bear">
        <div class="ear left"></div>

          <div class="eye left"><div class="pupil" id="pupilL"></div></div>

            <div class="blush left"></div>

            <div class="mouth"></div>
          </div>
        </div>
      </div>

  </main>

  <div id="celebrate" class="celebrate">
    <div class="card">
      <div class="text-6xl mb-3">❤️</div>
      <h2 class="text-3xl md:text-4xl font-bold text-rose-700">You said YES!</h2>
      <p class="mt-3 text-lg text-rose-600">
        Happy Girlfriends Day, my forever favorite person.
      </p>
      <button id="closeCelebration" class="mt-6 rounded-full bg-rose-600 text-white px-6 py-3 font-semibold">
        Keep smiling
      </button>
    </div>
  </div>

  <script>
    // Floating hearts
    const bg = document.getElementById('bg');
    const HEARTS = 34;
    for(let i=0;i<HEARTS;i++){
      const h = document.createElement('div');
      h.className = 'heart';
      const s = 8 + Math.random()*18;
      h.style.width = s + 'px';
      h.style.height = s + 'px';
      h.style.left = Math.random()*100 + 'vw';
      h.style.animationDuration = (10 + Math.random()*12) + 's';
      h.style.animationDelay = (-Math.random()*18) + 's';
      bg.appendChild(h);
    }

    // Bear eyes follow cursor/touch
    const pupils = [document.getElementById('pupilL'), document.getElementById('pupilR')];

    function moveEyes(x,y){
      pupils.forEach(p=>{
        const eye = p.parentElement;
        const r = eye.getBoundingClientRect();
        const cx = r.left + r.width/2;
        const cy = r.top + r.height/2;
        const dx = x - cx;
        const dy = y - cy;
        const angle = Math.atan2(dy, dx);
        const max = 8;
        const tx = Math.cos(angle)*Math.min(max, Math.hypot(dx,dy)/18);
        const ty = Math.sin(angle)*Math.min(max, Math.hypot(dx,dy)/18);
        p.style.transform = `translate(${tx}px, ${ty}px)`;
      });
    }

    window.addEventListener('mousemove', e => moveEyes(e.clientX, e.clientY));
    window.addEventListener('touchmove', e => {
      if(e.touches.length){
        const t = e.touches[0];
        moveEyes(t.clientX, t.clientY);
      }
    }, {passive:true});

    // Escaping No button
    const noBtn = document.getElementById('noBtn');
    let noPos = {x:0,y:0};

    function placeInitialNo(){
      const r = noBtn.getBoundingClientRect();
      noPos.x = window.innerWidth/2 + 120;
      noPos.y = window.innerHeight/2 + 70;
      noBtn.style.left = noPos.x + 'px';
      noBtn.style.top = noPos.y + 'px';
    }

    function teleportNo(){
      const pad = 16;
      const r = noBtn.getBoundingClientRect();
      const maxX = Math.max(pad, window.innerWidth - r.width - pad);
      const maxY = Math.max(pad, window.innerHeight - r.height - pad);
      noPos.x = pad + Math.random()*(maxX-pad);
      noPos.y = pad + Math.random()*(maxY-pad);
      noBtn.style.left = noPos.x + 'px';
      noBtn.style.top = noPos.y + 'px';
      noBtn.style.transform = `translate(${(Math.random()-0.5)*6}px, ${(Math.random()-0.5)*6}px)`;
    }

    function repelFrom(x,y){
      const r = noBtn.getBoundingClientRect();
      const cx = r.left + r.width/2;
      const cy = r.top + r.height/2;
      const d = Math.hypot(x-cx, y-cy);
      if(d < 120) teleportNo();
    }

    window.addEventListener('mousemove', e => repelFrom(e.clientX, e.clientY));
    window.addEventListener('touchstart', e => {
      if(e.touches.length){
        const t = e.touches[0];
        repelFrom(t.clientX, t.clientY);
      }
    }, {passive:true});
    window.addEventListener('touchmove', e => {
      if(e.touches.length){
        const t = e.touches[0];
        repelFrom(t.clientX, t.clientY);
      }
    }, {passive:true});

    noBtn.addEventListener('mouseenter', teleportNo);
    noBtn.addEventListener('pointerdown', e => {
      e.preventDefault();
      teleportNo();
    });

    window.addEventListener('resize', placeInitialNo);
    placeInitialNo();

    // Confetti
    const canvas = document.getElementById('confetti');
    const ctx = canvas.getContext('2d');
    function resizeCanvas(){
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    function burstConfetti(){
      const pieces = [];
      const colors = ['#e11d48','#f472b6','#fb7185','#f59e0b','#fde68a','#ffffff'];

      for(let i=0;i<220;i++){
        pieces.push({
          x: canvas.width/2,
          y: canvas.height/2,
          vx:(Math.random()-0.5)*12,
          vy:(Math.random()-0.8)*12,
          size:4+Math.random()*6,
          color:colors[Math.floor(Math.random()*colors.length)],
          rot:Math.random()*Math.PI,
          vr:(Math.random()-0.5)*0.3,
          life:90+Math.random()*50
        });
      }

      function frame(){
        ctx.clearRect(0,0,canvas.width,canvas.height);
        let alive = 0;
        for(const p of pieces){
          if(p.life<=0) continue;
          alive++;
          p.life--;
          p.vy += 0.12;
          p.x += p.vx;
          p.y += p.vy;
          p.rot += p.vr;

          ctx.save();
          ctx.translate(p.x,p.y);
          ctx.rotate(p.rot);
          ctx.fillStyle = p.color;
          ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size*1.5);
          ctx.restore();
        }
        if(alive) requestAnimationFrame(frame);
        else ctx.clearRect(0,0,canvas.width,canvas.height);
      }
      frame();
    }

    // Yes celebration
    const celebrate = document.getElementById('celebrate');
    document.getElementById('yesBtn').addEventListener('click', ()=>{
      burstConfetti();
      celebrate.classList.add('show');
    });
    document.getElementById('closeCelebration').addEventListener('click', ()=>{
      celebrate.classList.remove('show');
    });

    // Initial eye target
    moveEyes(window.innerWidth/2, window.innerHeight/2);
  </script>

</body>
</html>
